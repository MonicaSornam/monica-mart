<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Account — MONICA MART</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <span class="logo-accent">🌸</span>
                MONICA <span>MART</span>
            </a>
            <ul class="nav-links" id="main-nav">
                <!-- Injected dynamically by main.js -->
            </ul>
        </div>
    </header>

    <main class="container">
        <div class="auth-wrapper">
            <div class="auth-card">
                <h2>Create Account</h2>
                <p class="subtitle">Join Monica Mart as a Buyer or Seller</p>

                <form id="register-form">
                    <div class="form-group">
                        <label>Select Your Account Type</label>
                        <div class="role-selector">
                            <label class="role-option selected">
                                <input type="radio" name="role" value="BUYER" checked style="display: none;">
                                👤 <strong>Buyer</strong>
                                <div style="font-size: 0.76rem; color: var(--text-muted); margin-top: 3px;">Shop & Review</div>
                            </label>
                            <label class="role-option">
                                <input type="radio" name="role" value="SELLER" style="display: none;">
                                🏪 <strong>Seller</strong>
                                <div style="font-size: 0.76rem; color: var(--text-muted); margin-top: 3px;">List & Manage Products</div>
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="reg-name">Full Name</label>
                        <input type="text" id="reg-name" class="form-control" placeholder="e.g. Monica Sornam" required autocomplete="name">
                    </div>

                    <div class="form-group">
                        <label for="reg-email">Email Address</label>
                        <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label for="reg-password">Password</label>
                        <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters" required autocomplete="new-password">
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 10px;">
                        Register Now 🌸
                    </button>
                </form>

                <p style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-muted);">
                    Already have an account? 
                    <a href="login.html" class="bold" style="color: var(--lavender-dark);">Log in here</a>
                </p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container footer-inner">
            <div>
                <strong style="color: var(--lavender-dark);">MONICA MART</strong> — College Capstone Project by Monica Sornam
            </div>
            <div>
                <span style="color: var(--text-muted);">&copy; 2026 MONICA MART</span>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/chatbot.js"></script>
</body>
</html>
