<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders — MONICA MART</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header -->
    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <div class="logo-icon">M</div>
                MONICA <span>MART</span>
            </a>
            <button class="mobile-nav-toggle" id="mobile-nav-toggle">☰</button>
            <ul class="nav-links" id="main-nav"></ul>
        </div>
    </header>

    <main class="container" style="margin-top: 30px; margin-bottom: 60px;">
        <div style="margin-bottom: 24px;">
            <h1 style="font-size: 2rem;">My Order History</h1>
            <p class="text-muted">Track your past purchases and delivery statuses</p>
        </div>

        <div id="orders-list-container">
            <div style="text-align: center; padding: 60px;">
                <p class="text-muted">Loading your past orders...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container footer-inner">
            <div>
                <strong style="color: var(--primary);">MONICA MART</strong> — Multi-Seller E-Commerce Marketplace
                <p style="font-size: 0.82rem; margin-top: 4px;">Developer: Monica Sornam | College Capstone Project</p>
            </div>
            <div>&copy; 2026 MONICA MART. All rights reserved.</div>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = AppState.getUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            if (user.role !== 'BUYER') {
                document.getElementById('orders-list-container').innerHTML = `
                    <div class="table-card text-center" style="padding: 50px;">
                        <h3>Buyer Orders</h3>
                        <p class="text-muted" style="margin: 12px 0 20px 0;">You are logged in as a <strong>${user.role}</strong>. Buyer purchase history is only available for Buyer accounts.</p>
                        <a href="seller-dashboard.html" class="btn btn-primary">Go to Seller Dashboard</a>
                    </div>
                `;
                return;
            }

            loadOrders();
        });

        async function loadOrders() {
            const container = document.getElementById('orders-list-container');
            const res = await apiRequest('/orders');

            if (!res.ok || !res.data.success || !res.data.orders || res.data.orders.length === 0) {
                container.innerHTML = `
                    <div class="table-card text-center" style="padding: 60px;">
                        <div style="font-size: 3rem; margin-bottom: 12px;">📦</div>
                        <h3>No orders placed yet</h3>
                        <p class="text-muted" style="margin: 8px 0 24px 0;">You have not placed any orders so far.</p>
                        <a href="products.html" class="btn btn-primary">Start Shopping</a>
                    </div>
                `;
                return;
            }

            const orders = res.data.orders;
            container.innerHTML = orders.map(ord => {
                let badgeClass = 'badge-warning';
                if (ord.status === 'Delivered') badgeClass = 'badge-success';
                else if (ord.status === 'Cancelled') badgeClass = 'badge-danger';
                else if (ord.status === 'Shipped') badgeClass = 'badge-purple';

                return `
                    <div class="order-card">
                        <div class="order-card-header">
                            <div>
                                <strong style="font-size: 1.1rem; color: var(--primary);">Order #${ord.order_id}</strong>
                                <span class="text-muted" style="font-size: 0.85rem; margin-left: 12px;">📅 ${ord.created_at || 'Recently'}</span>
                            </div>
                            <div>
                                <span class="badge ${badgeClass}">${ord.status}</span>
                            </div>
                        </div>

                        <div style="margin-bottom: 14px;">
                            ${(ord.items || []).map(item => `
                                <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--border);">
                                    <div style="display: flex; align-items: center; gap: 12px;">
                                        <img src="${item.image || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600'}" style="width: 44px; height: 44px; border-radius: 6px; object-fit: cover;">
                                        <div>
                                            <a href="product-details.html?id=${item.product_id}" style="font-weight: 600; color: var(--text-main);">${item.product_name}</a>
                                            <div class="text-muted" style="font-size: 0.8rem;">Seller: ${item.seller_name} | Qty: ${item.quantity}</div>
                                        </div>
                                    </div>
                                    <div class="bold">${formatPrice(item.price_per_unit * item.quantity)}</div>
                                </div>
                            `).join('')}
                        </div>

                        <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 10px;">
                            <div class="text-muted" style="font-size: 0.85rem;">
                                📍 Delivery Address: ${ord.shipping_address || 'Default Address'}
                            </div>
                            <div style="font-size: 1.15rem;">
                                Total Amount: <strong style="color: var(--primary);">${formatPrice(ord.total_amount)}</strong>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
