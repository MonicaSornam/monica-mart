<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — MONICA MART</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <span class="logo-accent">🌸</span>
                MONICA <span>MART</span>
            </a>
            <ul class="nav-links" id="main-nav">
                <!-- Injected dynamically by main.js -->
            </ul>
        </div>
    </header>

    <main class="container">
        <div class="auth-wrapper">
            <div class="auth-card">
                <h2>Welcome Back</h2>
                <p class="subtitle">Log in to your Monica Mart account</p>

                <form id="login-form">
                    <div class="form-group">
                        <label for="login-email">Email Address</label>
                        <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 10px;">
                        Log In
                    </button>
                </form>

                <!-- Quick Test Credentials for Viva Evaluation -->
                <div style="margin-top: 26px; padding-top: 20px; border-top: 1px dashed var(--border);">
                    <div style="font-size: 0.82rem; font-weight: 700; color: var(--text-muted); margin-bottom: 10px; text-align: center;">
                        QUICK DEMO ACCOUNTS (1-CLICK AUTOFILL)
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
                        <button type="button" class="btn btn-sm btn-outline" onclick="fillDemoAccount('buyer')">
                            👤 Buyer
                        </button>
                        <button type="button" class="btn btn-sm btn-outline" onclick="fillDemoAccount('seller')">
                            🏪 Seller
                        </button>
                        <button type="button" class="btn btn-sm btn-outline" onclick="fillDemoAccount('admin')">
                            🛡️ Admin
                        </button>
                    </div>
                </div>

                <p style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-muted);">
                    Don't have an account yet? 
                    <a href="register.html" class="bold" style="color: var(--lavender-dark);">Register here</a>
                </p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container footer-inner">
            <div>
                <strong style="color: var(--lavender-dark);">MONICA MART</strong> — College Capstone Project by Monica Sornam
            </div>
            <div>
                <span style="color: var(--text-muted);">&copy; 2026 MONICA MART</span>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/chatbot.js"></script>
</body>
</html>
